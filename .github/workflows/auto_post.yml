name: Threads Affiliate Auto-Post

on:
  push:
    branches: [main]
    paths:
      - "config/product_links.txt"
  schedule:
    # 08:00, 12:30, 20:30 GMT+7 (Vietnam peak Threads hours)
    - cron: "0 1 * * *"
    - cron: "30 5 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Publish LIVE to Threads API (false = safe dry-run)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests (Core_QA_Audit)
        run: python3 -m unittest discover -s tests -v

      - name: Run Threads Affiliate Pipeline
        env:
          PRODUCT_LINKS_FILE: ${{ vars.PRODUCT_LINKS_FILE || 'config/product_links.txt' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.live }}" = "true" ] || ([ "$DRY_RUN" = "false" ] && [ -n "$THREADS_ACCESS_TOKEN" ]); then
            python3 -m src.pipeline --mode publish --live
          else
            python3 -m src.pipeline --mode publish
          fi
